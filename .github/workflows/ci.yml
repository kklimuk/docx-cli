name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:

  check:
    name: Lint + Types + Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run test:benchmark

  macos-output:
    name: macOS output contract (Bun ${{ matrix.bun-version }})
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.10", "latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun test tests/cli/output-contract.test.ts

  integration-tests:
    name: Integration Tests (LibreOffice)
    # Pinned, not ubuntu-latest: the OS release decides which LibreOffice apt
    # installs, so a silent ubuntu-latest bump would change the renderer under
    # test. 26.04 ships LibreOffice 26.2, matching current desktop installs and
    # the Windows job's libreoffice-fresh; 24.04 would test against 24.2.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      LIBREOFFICE_PACKAGES: libreoffice-core libreoffice-writer fontconfig
    defaults:
      run:
        # Explicit bash adds pipefail (the implicit default is `bash -e`), so a
        # failed `apt-get --print-uris` fails its step instead of keying the
        # cache on an empty package list.
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # LibreOffice's ~100 MB of .debs come from the runner's Azure apt mirror,
      # which intermittently trickles at ~35 KB/s (2026-11-06: three PRs timed
      # out mid-download). Acquire::Retries can't help — a slow transfer never
      # errors. So the .debs ride actions/cache: metadata (`apt-get update`,
      # fast even when the mirror is slow) resolves the exact package set, its
      # filenames key the cache, and apt only downloads what the cache lacks.
      # apt verifies every cached .deb against the signed index's SHA256, so a
      # stale or corrupt cache entry is re-fetched, never installed.
      - name: Resolve LibreOffice packages
        id: libreoffice-debs
        timeout-minutes: 2
        run: |
          sudo apt-get update -o Acquire::Retries=3
          # Key on .deb filenames (name_version_arch), not URIs: the URI carries
          # the mirror host, which the fallback below may change.
          packages=$(sudo apt-get install -y --no-install-recommends --print-uris -qq $LIBREOFFICE_PACKAGES | awk '{ print $2 }' | sort)
          echo "$packages"
          . /etc/os-release
          prefix="libreoffice-debs-$ID-$VERSION_ID-${{ runner.arch }}-"
          echo "key=$prefix$(echo "$packages" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "restore-key=$prefix" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: libreoffice-cache
        with:
          path: ~/apt-debs
          key: ${{ steps.libreoffice-debs.outputs.key }}
          # A partial hit (Ubuntu shipped a new build of some packages) still
          # saves most of the download: apt fetches only the changed .debs.
          restore-keys: ${{ steps.libreoffice-debs.outputs.restore-key }}
      - name: Download LibreOffice packages
        # Download-only so a timeout can never interrupt dpkg mid-unpack. On a
        # cache miss through a stalled Azure mirror, the first attempt gives up
        # and the second goes straight to archive.ubuntu.com. The cap leaves
        # the fallback's `apt-get update` two minutes between the two attempts.
        timeout-minutes: 7
        run: |
          mkdir -p ~/apt-debs/partial
          download() {
            sudo timeout "$1" apt-get install -y --no-install-recommends --download-only \
              -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-debs" $LIBREOFFICE_PACKAGES
          }
          if download 120; then exit 0; fi
          echo "::warning::LibreOffice download stalled or failed on the runner's apt mirror; retrying from archive.ubuntu.com"
          # Runner images route every pocket through this mirrorlist (Azure first).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          download 180
      - name: Stage LibreOffice packages for the cache
        id: libreoffice-stage
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        # A restore-keys hit carried the previous set's .debs forward; autoclean
        # drops the ones no index still lists, so the entry doesn't grow ~100 MB
        # with every LibreOffice update. apt downloaded as root and left its
        # lock + partial/ behind; the cache action runs as the runner user and
        # should store only the .debs.
        run: |
          sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-debs"
          sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-debs
          # Re-key from the lists the .debs were downloaded against: the mirror
          # fallback can land newer versions than the restore key resolved.
          packages=$(sudo apt-get install -y --no-install-recommends --print-uris -qq $LIBREOFFICE_PACKAGES | awk '{ print $2 }' | sort)
          echo "key=${{ steps.libreoffice-debs.outputs.restore-key }}$(echo "$packages" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v5
        # Saved now, not in a post-job step, so a red test run still warms the
        # cache for the next one.
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        with:
          path: ~/apt-debs
          key: ${{ steps.libreoffice-stage.outputs.key }}
      - name: Install LibreOffice
        # Every .deb is local by now; this is dpkg unpack + configure only.
        timeout-minutes: 3
        run: |
          mkdir -p ~/apt-debs/partial
          sudo apt-get install -y --no-install-recommends --no-download \
            -o Dir::Cache::Archives="$HOME/apt-debs" $LIBREOFFICE_PACKAGES
      - name: Pre-warm fontconfig cache
        # Parallel soffice workers race to populate ~/.cache/fontconfig and the
        # losers print "Fontconfig error: No writable cache directories" to
        # stderr, failing the round-trip test's empty-stderr assertion. One
        # serial fc-cache populates the cache so workers just read it.
        run: |
          mkdir -p "$HOME/.cache/fontconfig"
          fc-cache -f
      - run: bun install --frozen-lockfile
      - run: DOCX_LO_ALL=1 bun run test:integration # full fixture sweep in CI

  windows-render:
    name: Render through LibreOffice (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install LibreOffice
        shell: pwsh
        run: choco install libreoffice-fresh -y --no-progress --limit-output
      - run: bun install --frozen-lockfile
      - run: bun test tests/cli/render.test.ts tests/cli/images.test.ts
      - run: bun run build:binary
      - name: Render with the compiled binary
        run: |
          ./dist/docx render tests/fixtures/markdown-import.docx --out smoke --engine libreoffice --pages 1
          test -s smoke/page-001.png

  build-binary:
    name: Smoke-build compiled binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Covers the Windows leg's informational unit-test step (its own 15-minute cap).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:binary
      - name: Sign and verify macOS binary
        if: runner.os == 'macOS'
        run: sh scripts/sign-macos-binary.sh ./dist/docx
      - name: Verify binary runs
        # Git Bash on Windows, the shell `docx upgrade` needs there; bash also stops at
        # the first failing line, where the default PowerShell would carry on.
        shell: bash
        run: |
          ./dist/docx --version
          ./dist/docx --help > /dev/null
          ./dist/docx read tests/fixtures/markdown-import.docx > /dev/null
          ./dist/docx validate tests/fixtures/markdown-import.docx
      - name: Verify the installer on a Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: bun test tests/cli/installer.test.ts
      - name: Unit tests on Windows (informational)
        # Known Windows-only failures remain, so this reports without failing the job.
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: bun run test:unit
      - name: Upgrade the compiled binary against a real release
        # Runs last: it replaces dist/docx. The version is pinned so that a new release
        # can't change what this checks, and only the release's assets are downloaded.
        shell: bash
        run: |
          ./dist/docx upgrade --dry-run
          ./dist/docx upgrade --to v0.28.0
          ./dist/docx --version | grep -F 0.28.0
      - name: Verify the Windows swap
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f dist/docx.exe.old
          test ! -e dist/.docx-upgrade
