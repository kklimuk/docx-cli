name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: bun-linux-x64,    name: docx-linux-x64 }
          - { os: ubuntu-latest,  target: bun-linux-arm64,  name: docx-linux-arm64 }
          - { os: macos-15-intel, target: bun-darwin-x64,   name: docx-darwin-x64 }
          - { os: macos-latest,   target: bun-darwin-arm64, name: docx-darwin-arm64 }
          - { os: windows-latest, target: bun-windows-x64,  name: docx-windows-x64.exe }
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Compile
        run: bun build --compile --target=${{ matrix.target }} --outfile=${{ matrix.name }} src/index.ts
      # Sign after compilation (and any future binary rewriting), before upload.
      - name: Sign and verify macOS artifact
        if: runner.os == 'macOS'
        run: sh scripts/sign-macos-binary.sh "./${{ matrix.name }}"
      - name: Smoke-test macOS artifact natively
        if: runner.os == 'macOS'
        run: |
          ./${{ matrix.name }} --version
          ./${{ matrix.name }} --help > /dev/null
          ./${{ matrix.name }} read tests/fixtures/markdown-import.docx > /dev/null
          ./${{ matrix.name }} validate tests/fixtures/markdown-import.docx
      - name: Smoke-test render on Linux artifact
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'bun-linux-x64'
        run: |
          sudo apt-get update && sudo apt-get install -y libreoffice
          ./${{ matrix.name }} render tests/fixtures/markdown-import.docx \
            --out /tmp/smoke --engine libreoffice --pages 1
          test -s /tmp/smoke/page-001.png
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
      - name: Stage attribution files for release
        # Per LGPL §4 we ship LGPL-3.0.txt + NOTICES alongside every binary;
        # NOTICES is the canonical attribution surface for PDFium (BSD-3),
        # jpeg-js (BSD-3), highlight.js (BSD-3), and libheif (LGPL).
        run: cp LICENSE LGPL-3.0.txt NOTICES ./artifacts/
      - name: Stage install.sh for release
        # Shipped as a release asset (not served from a branch) so the documented install
        # command pins to a tag and is covered by SHA256SUMS below. It lives in the skill
        # folder because bootstrap.sh delegates to it as a local sibling — one copy of
        # the logic, published two ways. See the installer invariant in CLAUDE.md.
        run: cp skills/docx-cli/scripts/install.sh ./artifacts/
      - name: Generate SHA256SUMS for the release assets
        # Hash the final signed bytes downloaded from the build jobs. Never modify
        # a binary after this step.
        # Published as a release asset so install.sh / bootstrap.sh can verify the
        # downloaded binary's integrity, and so install.sh itself can be verified
        # before it is run (supply-chain hardening).
        run: |
          cd ./artifacts
          sha256sum docx-* install.sh > SHA256SUMS
          cat SHA256SUMS
      - name: List artifacts
        run: ls -la ./artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
