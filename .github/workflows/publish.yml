name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: Publishing

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # node 24.x already bundles npm >= 11.5.1 (trusted-publishing capable —
      # 24.18 ships 11.16.0). Do NOT `npm install -g npm@latest`: the self-upgrade
      # drops bundled deps (notably `sigstore`), and provenance generation for
      # trusted publishing then dies with "Cannot find module 'sigstore'".
      - run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --access public
